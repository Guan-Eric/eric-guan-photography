name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      e2e_suite:
        description: "E2E suite to run"
        type: choice
        required: true
        default: critical
        options:
          - smoke
          - critical
          - regression

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck + Unit/Integration
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11 (lockfile requires npm >= 11.10)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit/integration tests
        run: npm test

      - name: Production env structure check
        run: npm run setup:check
        env:
          AUTH_SESSION_SECRET: ci-auth-secret-placeholder
          ADMIN_SESSION_SECRET: ci-admin-secret-placeholder
          PLATFORM_NAME: Studiofront
          PLATFORM_ROOT_DOMAIN: studiofront.ca
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          STRIPE_PRICE_STARTER: price_ci_starter
          STRIPE_PRICE_GROWTH: price_ci_growth
          STRIPE_PRICE_STUDIO: price_ci_studio
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          STRIPE_PRICE_PAYG_BASE: price_ci_payg_base
          STRIPE_PRICE_PAYG_LISTING: price_ci_payg_listing
          STRIPE_PRICE_OVERAGE_LISTING: price_ci_overage
          STRIPE_PRICE_DOMAIN_ADDON: price_ci_domain
          STRIPE_PRICE_LIFETIME: price_ci_lifetime
          CRON_SECRET: ci-cron-secret
          RESEND_API_KEY: re_ci_placeholder
          CLOUDFLARE_R2_ACCOUNT_ID: ci
          CLOUDFLARE_R2_ACCESS_KEY_ID: ci
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ci
          CLOUDFLARE_R2_BUCKET: ci
          DATABASE_URL: postgresql://ci:ci@localhost/ci
          PLATFORM_EMAIL_FROM: "Studiofront <hello@example.com>"

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11 (lockfile requires npm >= 11.10)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite on pull requests
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:smoke

      - name: Run regression suite before deploy
        if: github.event_name == 'push'
        run: npm run test:e2e:regression

      - name: Run regression suite nightly
        if: github.event_name == 'schedule'
        run: npm run test:e2e:regression

      - name: Run selected suite manually
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:e2e:${{ inputs.e2e_suite }}

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
