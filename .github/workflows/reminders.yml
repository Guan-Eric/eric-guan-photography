# Manual fallback only — production uses Cloudflare Cron Trigger (see wrangler.jsonc).
name: Studiofront day-before reminders (manual)

on:
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Hit reminders cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://studiofront.ca/api/cron/reminders"
